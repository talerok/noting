name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build macOS app
        run: |
          xcodebuild build \
            -scheme Noting \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Create DMG
        run: |
          mkdir -p dmg-content
          cp -R build/Build/Products/Release/Noting.app dmg-content/
          ln -s /Applications dmg-content/Applications
          hdiutil create -volname Noting -srcfolder dmg-content -ov -format UDZO Noting.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Noting.dmg
